plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mani.simplepdfreader'
    compileSdk 35

    defaultConfig {
        applicationId 'com.mani.simplepdfreader'
        minSdk 21
        targetSdk 35
        versionCode 2
        versionName '2.0'
    }
}

dependencies {
    implementation 'com.tom-roush:pdfbox-android:2.0.27.0'
}
